services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragkb-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ragkb-redis
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 对象存储：silo（MinIO 社区延续，S3 兼容）。
  # 为什么不是 minio/minio：官方镜像已于 2025-10 下架、2026-02 仓库归档，
  # Docker Hub 返回 404、quay.io 返回 401。silo 命令与接口一致，只换镜像。
  # 详见 docs/adr/0010。
  silo:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    container_name: ragkb-silo
    # 9001 固定为控制台端口；不指定会随机分配，无法从宿主机访问
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - silodata:/data
    healthcheck:
      # silo 自带 healthcheck 子命令（容器内已实测 exit 0），不依赖 curl
      test: ["CMD", "silo", "healthcheck", "live"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: ragkb-backend
    ports:
      - "${BACKEND_PORT}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      # Ollama 跑在宿主机：容器内 localhost 不是宿主机，
      # 必须用 host.docker.internal（macOS Docker Desktop 自动解析）
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      # 嵌入服务（bge-m3）也跑在宿主机 Ollama，同上用 host.docker.internal。
      # embedding.py 读 OLLAMA_BASE_URL；不配则回退到容器内 localhost，
      # 容器里那是它自己（不是宿主 Ollama），嵌入调用会失败。
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # 显式传入嵌入模型与维度（值与 embedding.py 默认一致，但不靠隐式默认）
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIM: ${EMBEDDING_DIM}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY}
      # 对象存储（silo）：容器内用 compose 服务名 silo，宿主脚本会替换为 localhost
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    # ★ 开发模式：把宿主源码/迁移挂进容器。否则容器里跑的是"构建时的代码快照"，
    #   新增或修改的文件（如 alembic/versions/0002_*.py）容器内看不到，
    #   `make migrate` 会一直停在旧 revision（必须 --build 才能生效，极易误判）。
    #   生产镜像不受影响：仍由 Dockerfile 的 COPY 打进镜像。
    #   只挂这三项（都是 Dockerfile COPY 的代码/配置），不挂整个项目根，
    #   以免把 .env / .venv / tests 暴露进容器。
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    # 开发专用：热重载。这里覆盖 Dockerfile 的 CMD —— 生产镜像的 CMD 不带 --reload，
    # 不受影响。app/ 已挂载，改宿主代码即触发重载，不必 restart 容器。
    # --reload-dir 只监听 /app/app（默认监听整个 /app）：改 alembic/ 下文件不会
    # 无谓地重启服务（迁移由 alembic 命令自身重新执行，不需要重启进程）。
    command: >-
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      silo:
        condition: service_healthy

  # 入库 worker（V0.1 · T18）：BRPOP 消费 queue:ingest，跑 T13 的入库编排。
  # ★ R10 在线/离线隔离：与 backend 是两个进程——解析/向量化再重也不会卡在线请求。
  #   复用 backend 同一镜像（代码同源），只换入口命令；同样挂源码卷保证
  #   "宿主编码 → 容器可见"与 backend 一致（worker 不走热重载，改代码后需
  #   docker compose restart worker——进程型服务没有 --reload 语义）。
  worker:
    build: .
    container_name: ragkb-worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      # 与 backend 同理：Ollama 嵌入服务在宿主机，必须走 host.docker.internal
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIM: ${EMBEDDING_DIM}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    volumes:
      - ./app:/app/app
    command: python -m app.workers.ingest_worker
    # 基础设施故障（Redis/DB 连不上）时 worker 会显式退出（R7），交给 restart 拉起
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      silo:
        condition: service_healthy
      backend:
        condition: service_started

  # 前端（V0.1 · T26）：Next.js 15 dev server。
  # ★ node_modules 不从宿主挂载（宿主/容器 glibc 与可选依赖不同会坏），
  #   起容器时 npm install 一次（有 package-lock 缓存层，非首次秒过）。
  #   源码挂载 + dev 模式 = 宿主改代码即时生效。
  frontend:
    image: node:22
    container_name: ragkb-frontend
    working_dir: /web
    environment:
      # 容器网络内直达 backend 服务名；宿主跑 npm run dev 时不需要它
      BACKEND_ORIGIN: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./web:/web
      # 匿名卷保住容器内装好的 node_modules，不被宿主空目录覆盖
      - web_node_modules:/web/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  silodata:
  web_node_modules:
