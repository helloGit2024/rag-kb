# 评估标准题库（golden_set_v1.yaml）
#
# ═══════════════════════════════════════════════════════════════════════
# 这份文件是整个项目质量的地基。
#
# 铁律：标准答案必须由我（人）确认，不能全交给 AI 生成。
#       AI 既出题又定答案 = 自己考自己，评估毫无意义。
#       AI 可以做的是：搭结构、生成候选题目、按我的口述整理格式。
#
# ═══════════════════════════════════════════════════════════════════════
#
# 【版本说明】
#   · V0.1：30 条起步集（Q001—Q030），四类齐全，已在 golden_set.yaml 确认。
#   · V1.0：扩到 100 条（Q001—Q100）。
#        - normal  18 → 60 条（+42：全部来自新生成的《员工手册.md》，答案可由文档直接核验）
#        - permission  3 → 10 条（+7）
#        - refuse      6 → 20 条（+14）
#        - edge        3 → 10 条（+7）
#   · 本文件相比 golden_set.yaml 已新增版本号（V0.1 → V1.0），使用前请重新注册数据集。
#
# ═══════════════════════════════════════════════════════════════════════
#
# 【本评估集假设的语料】（换成你的真实语料时，这份清单要一起换）
#   · 员工手册.txt              公开   ← 已由 AI 生成《员工手册.md》作为语料底稿
#   · 财务报销制度.txt          内部
#   · 信息安全管理制度.txt      内部
#   · 研发流程规范.txt          部门专属：研发部
#   · 销售部客户分级管理办法.txt 部门专属：销售部
#   · 产品X30技术白皮书.txt      内部
#   · 产品发布公告2026Q3.txt     公开
#
# 【V1.0 新增题目的说明】
#   · Q031—Q072（normal，+42）全部取材自《员工手册.md》，expected_answer 可直接对照该文档核验；
#     建议人工过一遍后把 `notes` 中「待人工确认」的条目一一确认，再注册数据集。
#   · Q073—Q100（permission/refuse/edge）为能力边界题，标准答案基本是固定拒答/边界行为，不依赖文档具体内容。
#   · 财务报销、信息安全、研发流程、销售分级、X30 白皮书、Q3 公告这 6 份文档的 normal 题
#     在 V0.1 的 Q007—Q018 中已有覆盖；待这些文档定稿后，可再按相同方法为它们补充 normal 题。
#
# 【字段说明】（每条题目的结构）
#   id                必填，文件内唯一，如 Q001
#   version           引入版本
#   question          用户会怎么说（用真实口语，不要写成考试题）
#   category          必填，四选一：normal / refuse / permission / edge
#   expected_answer   标准答案（**必须经我人工确认**）
#   expected_sources  标准来源文档名（Recall@K 的判定依据）
#   should_refuse     该题系统该不该拒答（refuse 类必须为 true）
#   user_scope        权限类题目用：提问者的权限范围
#   notes             出题理由
#
# 标注进度：100 / 100 条已完成标准答案草拟；其中 30 条（V0.1）已人工确认，
#          42 条（Q031—Q072）待按《员工手册.md》人工确认后注册。
# 最近一次人工校准：2026-11-28，裁判与人工判断偏差 8%（阈值 15%）
# ═══════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────
# 一、normal 正常问答（60 条）—— 知识库里确实有答案
# ─────────────────────────────────────────────────────────────────────

- id: Q001
  version: V0.1
  question: "年假怎么算啊"
  category: normal
  expected_answer: |
    必须包含以下 3 个要点（按覆盖率评分，缺一扣分）：
    1. 满 1 年：5 天
    2. 满 3 年：10 天
    3. 满 5 年：15 天
    不允许出现：文档中不存在的档位（如"满 10 年 20 天"），
                也不允许把三档说成"大约"或做任何换算。
  expected_sources:
    - "员工手册.txt#年假章节"
  should_refuse: false
  user_scope: "public"
  notes: "最高频的制度查询；同时用于观察'列举型问题是否会被分块切散'"

