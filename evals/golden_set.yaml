# 评估标准题库（golden_set.yaml）
#
# ═══════════════════════════════════════════════════════════════════════
# 这份文件是整个项目质量的地基。
#
# 铁律：标准答案必须由我（人）确认，不能全交给 AI 生成。
#       AI 既出题又定答案 = 自己考自己，评估毫无意义。
#       AI 可以做的是：搭结构、生成候选题目、按我的口述整理格式。
#
# 数量要求：
#   - 起步至少 100 条（30 条以下指标波动可达 ±8%，分不清有效还是噪声）
#   - 本文件是 V0.1 的 30 条起步集，四类齐全
#
# 四类占比（30 条时的目标）：
#   normal     正常问答      18 条  60%
#   refuse     应拒答         6 条  20%  ← 衡量幻觉的唯一手段
#   permission 越权访问       3 条  10%  ← 数据泄露防线
#   edge       边界情况       3 条  10%
# ═══════════════════════════════════════════════════════════════════════
#
# 【本评估集假设的语料】（换成你的真实语料时，这份清单要一起换）
#   · 员工手册.txt              公开
#   · 财务报销制度.txt          内部
#   · 信息安全管理制度.txt      内部
#   · 研发流程规范.txt          部门专属：研发部
#   · 销售部客户分级管理办法.txt 部门专属：销售部
#   · 产品X30技术白皮书.txt      内部
#   · 产品发布公告2026Q3.txt     公开
# ═══════════════════════════════════════════════════════════════════════
#
# 【字段说明】（每条题目的结构）
#   id                必填，文件内唯一，如 Q001
#   version           引入版本
#   question          用户会怎么说（用真实口语，不要写成考试题）
#   category          必填，四选一：normal / refuse / permission / edge
#   tags              可选，自由标签（如 [年假, 假期制度]）
#                     ⚠️ 标签一放开就会失控（同义词丛生），见 docs/spec.md Q-06：
#                        要么先定枚举，要么明确"只作备注、不用于筛选"
#   expected_answer   标准答案（**必须经我人工确认**）
#   expected_sources  标准来源文档名（Recall@K 的判定依据）
#   should_refuse     该题系统该不该拒答（refuse 类必须为 true）
#   user_scope        权限类题目用：提问者的权限范围
#   notes             出题理由
#
# 【这份文件怎么改】
#   · 改完必须**重新注册数据集**（版本号 +1），否则 checksum 校验会拒绝评估
#     （见 docs/adr/0008、AGENTS.md R14）。
#   · promote 生成的候选题目先落在 evals/pending/，**不会自动进本文件**（R16）。
# ═══════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────
# 一、normal 正常问答（18 条）—— 知识库里确实有答案
# ─────────────────────────────────────────────────────────────────────

- id: Q001
  version: V0.1
  question: "年假怎么算啊"
  category: normal
  expected_answer: |
    必须包含以下 3 个要点（按覆盖率评分，缺一扣分）：
    1. 满 1 年：5 天
    2. 满 3 年：10 天
    3. 满 5 年：15 天
    不允许出现：文档中不存在的档位（如"满 10 年 20 天"），
                也不允许把三档说成"大约"或做任何换算。
  expected_sources:
    - "员工手册.txt#年假章节"
  should_refuse: false
  user_scope: "public"
  notes: "最高频的制度查询；同时用于观察'列举型问题是否会被分块切散'"

